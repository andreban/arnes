[workspace]
resolver = "3"
members = [
    "crates/arnes-core",
    "crates/arnes-tui",
    "crates/arnes-acp",
]

[workspace.dependencies]
async-trait = "0.1"
uuid        = { version = "1", features = ["v7"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio-util  = { version = "0.7" }
